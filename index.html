/* ===== 프로토타입 껍데기 (키오스크 화면 밖의 도구 모음) ===== */
:root { --wf-font: "Noto Sans", "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--wf-font); background: #eef3f4; color: #101820; overflow: hidden; }
.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: #101820; color: #ffffff; font-size: 13px; line-height: 1.4; }
.bar h1 { margin: 0; font-size: 13px; font-weight: 700; white-space: nowrap; }
.bar .lbl { color: #bdbdbd; font-size: 12px; white-space: nowrap; }
.bar .set { display: flex; gap: 4px; flex: none; }
.bar button, .bar select { font: inherit; font-size: 12px; height: 32px; padding: 0 12px; border: 1px solid #8fa1ab; border-radius: 6px; background: #101820; color: #ffffff; cursor: pointer; max-width: 300px; }
.bar button:hover, .bar select:hover { border-color: #ffffff; }
.bar button[aria-pressed="true"] { background: #ffe34d; color: #101820; border-color: #ffe34d; font-weight: 700; }
.bar .sp { flex: 1 1 auto; min-width: 0; }
.bar .hint { color: #bdbdbd; font-size: 12px; white-space: nowrap; }
.stage { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; container: stage / size; display: grid; place-items: center; padding: 4px; }
.device { height: min(calc(100cqh - 8px), calc((100cqw - 8px) / var(--arn, 0.5625))); aspect-ratio: var(--ar, 9 / 16); background: #ffffff; outline: 1px solid #b8c9cf; overflow: hidden; }
#mount { width: 100%; height: 100%; }
.wf .prog i { transition: width 1500ms linear; }
.plist { display: flex; flex-direction: column; gap: calc(16 * var(--u)); max-height: calc(900 * var(--u)); overflow-y: auto; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 60; max-width: min(560px, calc(100vw - 32px)); padding: 10px 16px; background: #101820; color: #ffffff; font-size: 13px; line-height: 1.5; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity 160ms ease-out; }
.toast.show { opacity: 1; }
@media (max-width: 1199px) { .bar .hint { display: none; } }
@media (max-width: 719px) {
  .bar { height: 36px; padding: 4px 16px; background: transparent; pointer-events: none; justify-content: center; gap: 8px; }
  .bar h1, .bar .hint, .bar .lbl, .bar .sp { display: none; }
  .bar button, .bar select { pointer-events: auto; height: 28px; font-size: 12px; padding: 0 8px; max-width: 150px; }
  .stage { top: 0; padding: 0; }
  .device { height: min(100cqh, calc(100cqw / var(--arn, 0.5625))); }
}
@media (prefers-reduced-motion: reduce) { .toast, .wf .prog i { transition: none; } }

.wf {
  --k: #111111;        
  --k2: #555555;       
  --k3: #666666;       
  --l2: #bdbdbd;       
  --l3: #e2e2e2;       
  --f1: #f4f4f4;       
  --f2: #e9e9e9;       
  --paper: #ffffff;
  font-family: var(--wf-font);
  font-weight: 400; color: var(--k); background: var(--paper);}

.wf .frame,.wfs-spec {
  --u4: calc(4 * var(--u)); --u8: calc(8 * var(--u)); --u12: calc(12 * var(--u)); --u16: calc(16 * var(--u));
  --u20: calc(20 * var(--u)); --u24: calc(24 * var(--u)); --u32: calc(32 * var(--u)); --u40: calc(40 * var(--u));
  --u48: calc(48 * var(--u)); --u64: calc(64 * var(--u)); --m: calc(70 * var(--u));
  --bw: calc(2 * var(--u)); --r: calc(8 * var(--u)); --r-sm: calc(4 * var(--u));
  --fs-display: calc(80 * var(--u)); --fs-h1: calc(56 * var(--u)); --fs-h2: calc(40 * var(--u));
  --fs-body: calc(32 * var(--u)); --fs-sm: calc(28 * var(--u));
  font-size: var(--fs-body); line-height: 1.5;}

.wf *,.wf *::before,.wf *::after { box-sizing: border-box; margin: 0; padding: 0;}

.wf ul,.wf ol { list-style: none;}

.wf button,.wf input,.wf textarea { font: inherit; color: inherit; letter-spacing: inherit;}

.wf :where(button) { background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;}

.wf :where(button[disabled]) { cursor: default;}

.wf :focus { outline: none;}

.wf :focus-visible { outline: var(--u8) solid var(--k); outline-offset: var(--u4);}

.wf.screen { width: 100%; height: 100%; container: screen / size; background: var(--paper);}

.wf .frame {
  --u: min(calc(100cqh / 1920), calc(100cqi / 884));
  position: relative; height: 100%;
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-template-rows: [top] auto [g1] var(--u48) [title] auto [g2] var(--u48) [body] minmax(0, 1fr) [g3] var(--u48) [bottom] auto [g4] var(--u24) [foot] auto;
  column-gap: var(--u20);
  padding: var(--u64) var(--m);}

.wf .z-top { grid-row: top; grid-column: 1 / -1;}

.wf .z-title { grid-row: title; grid-column: 1 / -1;}

.wf .right { display: contents;}

.wf .z-body { grid-row: body; grid-column: 1 / -1;}

.wf .z-bottom { grid-row: bottom; grid-column: 1 / -1;}

.wf .z-foot { grid-row: foot; grid-column: 1 / -1;}

.wf .g { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--u20); row-gap: var(--u16); align-items: center;}

.wf .c1 { grid-column: span 1;}

.wf .c2 { grid-column: span 2;}

.wf .c3 { grid-column: span 3;}

.wf .c4 { grid-column: span 4;}

.wf .c5 { grid-column: span 5;}

.wf .c6 { grid-column: span 6;}

.wf .c7 { grid-column: span 7;}

.wf .c8 { grid-column: span 8;}

.wf .c9 { grid-column: span 9;}

.wf .c10 { grid-column: span 10;}

.wf .c11 { grid-column: span 11;}

.wf .c12 { grid-column: 1 / -1;}

.wf .h1 { font-size: var(--fs-h1); font-weight: 700; line-height: calc(80 * var(--u)); letter-spacing: -0.01em;}

.wf .disp { font-size: var(--fs-display); font-weight: 700; line-height: calc(96 * var(--u)); letter-spacing: -0.02em;}

.wf .h2 { font-size: var(--fs-h2); font-weight: 700; line-height: calc(60 * var(--u)); letter-spacing: -0.01em;}

.wf .h3 { font-size: var(--fs-body); font-weight: 700; line-height: 1.5;}

.wf .t-sm { font-size: var(--fs-sm); line-height: 1.5;}

.wf .cap { font-size: var(--fs-sm); line-height: 1.5; color: var(--k2);}

.wf .mut { color: var(--k3);}

.wf .lead { font-size: var(--fs-sm); line-height: var(--u48); color: var(--k2); margin-top: var(--u8);}

.wf .caps { text-transform: uppercase; letter-spacing: 0.06em;}

.wf .ta-r { text-align: right;}

.wf .ta-c { text-align: center;}

.wf .z-top .g { height: calc(80 * var(--u));}

.wf .step { display: flex; align-items: baseline; gap: var(--u16); min-width: 0; white-space: nowrap;}

.wf .step .num,.wf .step .name { font-weight: 700;}

.wf .step .en { font-size: var(--fs-sm); color: var(--k2);}

.wf .pathtag { height: var(--u48); display: flex; align-items: center; justify-content: center; padding: 0 var(--u16); border-radius: var(--r-sm); background: var(--f2); font-size: var(--fs-sm); font-weight: 700; white-space: nowrap;}

.wf .langbtn { height: calc(80 * var(--u)); display: flex; align-items: center; justify-content: center; gap: var(--u12); padding: 0 var(--u24); border: var(--bw) solid var(--k); border-radius: var(--r); font-size: var(--fs-sm); font-weight: 700; min-width: 0;}

.wf .langbtn .ph { flex: none;}

.wf .steps { display: flex; gap: var(--u8); height: var(--u8); margin-top: var(--u24);}

.wf .steps li { flex: 1; border-radius: var(--u4); background: var(--l3);}

.wf .steps li.done { background: var(--k3);}

    body: WF.sec('해당하는 항목을 선택해 주세요', WF.grp(cards, 'emg'), { en: 'Emergency check' }) +
      `<div class="g c12"><div class="cap c8">응급 항목을 선택하는 순간 탐색을 멈추고 직원을 호출합니다. 급하면 언제든지 직원을 불러 주세요.</div>${WF.callBtn('c4')}</div>`,
    statusKind: noneSel ? 'ok' : '', status: noneSel ? '응급 징후 없음 · 확인 완료' : '해당 항목을 선택해 주세요 (없으면 ‘해당 없음’)',
    bottom: WF.nav({ prev: 'det-dir', next: 'det-clue', nextLabel: '다음: 단서 선택', dis: !noneSel }),
    foot: WF.footHome() });
};

/* 04-3 핵심 단서 선택 */
S['det-clue'] = function (st) {
  const kb = WF.kbFor(st), n = st.clues.length;
  const cards = kb.clues.map((c, i) => WF.opt('card', st.clues.includes(c.id), WF.kicker(`단서 ${i + 1}`) + c.title, `${c.desc}<span class="q">예상 질문 · ${c.q}</span>`, { v: c.id, cls: 'c6' }));
  return WF.frame({
    top: WF.top({ step: 4, lang: st.lang }),
    title: WF.title('확인할 단서를 골라 주세요', 'DETECTIVE · 대답할 수 있는 단서 2~3개를 고르면 짧은 질문이 이어집니다'),
    body: WF.trk(st, 0) + WF.sec('핵심 단서', WF.grp(cards, 'clue'), { en: 'Key clues', right: `2~3개 선택 · <b>${n}개</b>` }),
    statusKind: n >= 2 ? 'ok' : 'run', status: n >= 2 ? `단서 선택 완료 · ${n}개` : '단서를 2~3개 선택해 주세요',
    bottom: WF.detNav({ prev: 'det-emg', next: 'det-q@0', nextLabel: '다음: 질문 1', dis: n < 2 }),
    foot: WF.footHome() });
};

/* 04-4 ~ 04-6 선택형 질문 */
S['det-q'] = function (st, o) {
  o = o || {};
  const i = o.i || 0, kb = WF.kbFor(st), cid = st.clues[i], clue = kb.clues.find((c) => c.id === cid), total = st.clues.length, sel = st.answers[cid];
  const opts = WF.grp(clue.opts.map((op, oi) => WF.opt('card', sel === oi, op.t, op.why, { v: oi, cls: 'c6' })), 'answer');
  const before = WF.score(kb, WF.ansUpTo(st, i));
  const deltas = sel == null ? [] : WF.score(kb, WF.ansUpTo(st, i + 1)).map((r, k) => ({ r, d: r.score - before[k].score })).filter((x) => x.d !== 0);
  const effect = `<div class="note c12"><span class="h3">이 답변으로 달라지는 점</span>` +
    (sel == null ? '<span class="t-sm mut">답변을 선택하면 진료 방향이 어떻게 좁혀지는지 여기에 표시됩니다.</span>'
      : deltas.length ? deltas.map((x) => `<span class="t-sm">${x.r.kr} · <b>${x.d > 0 ? '관련성 높아짐' : '관련성 낮아짐'}</b></span>`).join('')
        : '<span class="t-sm">이 답변은 진료 방향에 큰 영향을 주지 않아요.</span>') + '</div>';
  return WF.frame({
    top: WF.top({ step: 4, lang: st.lang }),
    title: WF.title(clue.q, `DETECTIVE · 질문 ${i + 1} / ${total} · 단서: ${clue.title}`),
    body: WF.trk(st, sel == null ? i : i + 1) + `<div class="sec">${opts}</div>` + effect,
    statusKind: sel != null ? 'ok' : '', status: sel != null ? `질문 ${i + 1} 답변 완료` : '답변을 선택해 주세요',
    bottom: WF.detNav({ prev: i === 0 ? 'det-clue' : 'det-q@' + (i - 1), next: i + 1 < total ? 'det-q@' + (i + 1) : 'det-result',
      nextLabel: i + 1 < total ? `다음: 질문 ${i + 2}` : '다음: 탐색 결과', dis: sel == null }),
    foot: WF.footHome() });
};

/* 04-7 선별자 좁히기 · 탐색 결과 */
S['det-result'] = function (st) {
  const kb = WF.kbFor(st), ans = WF.ansUpTo(st), rows = WF.score(kb, ans), top = WF.topIdx(rows), T = rows[top];
  const clueOf = (id) => kb.clues.find((x) => x.id === id);
  const labels = st.clues.filter((c) => ans[c] != null).map((c) => clueOf(c).opts[ans[c]].t);
  const loweredBy = (r) => st.clues.filter((c) => ans[c] != null && ((clueOf(c).opts[ans[c]].ef || {})[r.id] || 0) < 0).map((c) => clueOf(c).title);
  const excluded = rows.filter((r) => r !== T && ['off', 'low'].includes(WF.level(r.score)));
  const exRows = excluded.length
    ? `<ul class="ex">${excluded.map((r) => { const by = loweredBy(r);
        return `<li><span class="nm">${r.kr}</span><span class="w">${by.length ? by.join(' · ') + ' 단서로 관련성이 낮아졌어요' : '선택한 단서와 관련이 낮아요'}</span></li>`; }).join('')}</ul>`
    : '<p class="t-sm">아직 제외된 방향이 없어요. 선택한 단서만으로는 좁히기 어려워, 접수 후 의료진이 확인합니다.</p>';
  const urgent = T.id === 'er';
  const result = `<div class="card accent c12"><div class="card-b"><span class="cap">추천 진료 방향</span><span class="disp">${T.kr}</span><span class="t-sm">${labels.join(' · ')}</span>` +
    (labels.length < st.clues.length ? `<span class="cap">선택한 답변으로 방향이 확정되어 남은 질문 ${st.clues.length - labels.length}개를 건너뛰었습니다.</span>` : '') +
    `<div class="g c12"><div class="chipset c9">${st.clues.map((c) => `<span class="tagch">${clueOf(c).title}</span>`).join('')}</div><div class="c3">${WF.btn('quiet sm', '단서 수정', { go: 'det-clue', act: 'edit' })}</div></div></div></div>`;
  return WF.frame({
    top: WF.top({ step: 4, lang: st.lang }),
    title: WF.title('탐색 결과를 확인하세요', 'DETECTIVE · 선택한 단서로 좁혀진 진료 방향입니다'),
    body: WF.trk(st) + result + WF.card({ title: '관련성이 낮아 제외된 방향', en: 'Excluded directions', body: exRows }) +
      WF.note('진단이 아닙니다', urgent ? '응급실 방문이 권장됩니다. 지금 직원에게 알려 주세요.' : '선택한 단서를 바탕으로 한 예상 방향이며, 의료진이 최종 판단합니다.', true) +
      (urgent ? WF.callBtn('c12', '직원에게 알리기') : ''),
    statusKind: 'ok', status: `탐색 완료 · 단서 ${st.clues.length}개 반영`,
    bottom: WF.nav({ prev: 'det-q@' + (st.clues.length - 1), next: 'sum-main', nextLabel: '다음: 요약 확인' }),
    foot: WF.footHome() });
};

/* 04-8 직원 호출 · 응급 안내 */
S['det-call'] = function (st, o) {
  o = o || {};
  const signs = st.emg.filter((id) => id !== 'none').map((id) => WF.EMG.find((e) => e[0] === id)[1]);
  const what = signs.length ? signs.join(', ') : '응급 징후';
  const steps = [['1', '자리에서 움직이지 말고 기다려 주세요', '직원이 곧 도착합니다'],
    ['2', '증상이 심해지면 비상벨을 누르거나 119에 전화하세요', '비상벨은 키오스크 옆에 있어요 · 119는 한국의 응급 전화입니다'],
    ['3', '영어 가능 직원이 함께 옵니다', '다른 언어가 필요하면 화면의 언어를 바꿔 주세요']]
    .map((s) => `<li><span class="n">${s[0]}</span><span class="tx">${s[1]}<span class="cap">${s[2]}</span></span></li>`).join('');
  return WF.frame({
    top: WF.top({ step: 4, lang: st.lang }),
    title: WF.title('직원을 호출했습니다', 'EMERGENCY · 응급 징후가 확인되어 탐색을 중단했습니다'),
    body: `<div class="card alert c12"><div class="card-b"><span class="h2">응급 징후가 확인되었어요</span><span class="t-sm">선택한 징후 · ${what}</span><span class="t-sm">탐색을 중단하고 직원을 호출했습니다. 잠시만 기다려 주세요.</span></div></div>` +
      WF.sec('지금 해야 할 일', `<ul class="steps-n c12">${steps}</ul>`, { en: 'What to do now' }) +
      `<div class="card f c12"><div class="g"><span class="t-sm c8"><b>직원 호출 중</b> · 호출 시각 14:31</span>${WF.btn('quiet sm', '다시 호출', { act: 'call', cls: 'c4' })}</div></div>`,
    statusKind: '', status: '잘못 선택했다면 ‘탐색으로 돌아가기’를 눌러 주세요',
    bottom: WF.btn('secondary', '탐색으로 돌아가기', { go: 'det-emg', act: 'back', cls: 'c12' }),
    foot: WF.footHome() });
};

/* 05-1 접수 정보 요약 (한국어 + 선택 언어 병기) */
S['sum-main'] = function (st) {
  const P = st.profile, I = st.insurance, E = WF.EN;
  const bi = !!st.lang && st.lang !== 'ko', en = (s) => (bi ? s : '');
  const partsKr = st.parts.map((id) => WF.REGION[id].s + (WF.REGION[id].d ? `(${WF.REGION[id].d})` : '')).join(', ');
  const partsEn = st.parts.map((id) => WF.REGION[id].en).join(', ');
  const c1 = WF.cell('이름', 'Name', esc(P.name), null, 'c6') +
    WF.cell('생년월일 · 성별', 'Birth · Gender', `${esc(P.birth)} · ${esc(P.gender)}`, en(`${esc(P.birth)} · ${E.g[P.gender] || ''}`), 'c6') +
    WF.cell('국적', 'Nationality', esc(P.nation), en(E.nation[P.nation] || ''), 'c4') + WF.cell('휴대폰', 'Phone', esc(P.phone), null, 'c4') +
    WF.cell('보험', 'Insurance', esc(I.type), en(E.ins[I.type] || ''), 'c4');
  const c2 = WF.cell('통증 부위', 'Pain area', partsKr, en(partsEn), 'c4') +
    WF.cell('통증 강도', 'Pain level', `${st.pain} / 10 · ${WF.painLabel(st.pain)}`, en(`${st.pain} / 10 · ${E.pain(st.pain)}`), 'c4') +
    WF.cell('주요 증상', 'Symptoms', st.symptoms.join(', '), en(st.symptoms.map((s) => E.sym[s] || s).join(', ')), 'c4');
  return WF.frame({
    top: WF.top({ step: 5, lang: st.lang }),
    title: WF.title('입력한 정보를 확인해 주세요', bi ? `SUMMARY · 한국어와 선택한 언어(${WF.langName(st.lang)})를 함께 표시합니다` : 'SUMMARY · 항목별로 확인한 뒤 다음을 눌러 주세요'),
    body: WF.card({ title: '개인정보 · 보험 정보', en: 'Personal & insurance', edit: 'reg-info', body: `<div class="cells">${c1}</div>` }) +
      WF.card({ title: '통증 부위 · 강도 · 주요 증상', edits: [['부위 수정', 'sym-body'], ['증상 수정', 'sym-level']], body: `<div class="cells">${c2}</div>` }),
    statusKind: '', status: '수정이 필요한 항목은 ‘수정’ 버튼을 눌러 주세요',
    bottom: WF.nav({ prev: 'det-result', next: 'sum-final', nextLabel: '다음: 최종 확인' }),
    foot: WF.footHome() });
};

/* 05-2 탐색 결과 · 최종 확인 · 동의 */
S['sum-final'] = function (st) {
  const kb = WF.kbFor(st), E = WF.EN;
  const bi = !!st.lang && st.lang !== 'ko', en = (s) => (bi ? s : '');
  const rows = WF.score(kb, WF.ansUpTo(st)), top = rows[WF.topIdx(rows)], ok = st.consents[0] && st.consents[1];
  const clueT = (f) => st.clues.map((c) => kb.clues.find((x) => x.id === c)[f]).join(' · ');
  const dirKr = `${top.kr} · ${WF.LEVEL_KR[WF.level(top.score)]}`, dirEn = `${top.en} · ${E.level[WF.level(top.score)]}`;
  const signs = st.emg.filter((id) => id !== 'none').map((id) => WF.EMG.find((e) => e[0] === id)[1]);
  const c1 = WF.cell(st.skipped ? '초기 진료 방향 (탐색 건너뛰기)' : '추천 진료 방향', 'Care direction', dirKr, en(dirEn), 'c6') +
    WF.cell('선택 단서', 'Selected clues', st.clues.length ? clueT('title') : '선택하지 않음', st.clues.length ? en(clueT('en')) : en('Not selected'), 'c6') +
    WF.cell('응급 징후', 'Emergency signs', signs.length ? signs.join(', ') : '없음', signs.length ? '' : en('None'), 'c6') +
    WF.cell('접수 방식 · 이름', 'Method · Name', `${st.path === 'pre' ? 'PRE-KIOSK 사전 접수' : '현장 직접 입력'} · ${esc(st.profile.name)}`, null, 'c6');
  const cons = (i, t) => WF.interactive
    ? `<div class="cons c12"><button type="button" class="cons-t" data-act="consent" data-v="${i}" aria-pressed="${!!st.consents[i]}">${WF.ind()}<span class="tx">${t}</span></button>${WF.btn('quiet sm', '보기', { act: 'terms', k: i })}</div>`
    : `<div class="cons c12" role="presentation"><span class="opt card cons-t" aria-pressed="${!!st.consents[i]}">${WF.ind()}<span class="tx">${t}</span></span>${WF.btn('quiet sm', '보기', {})}</div>`;
  const texts = ['개인정보 수집·이용에 동의합니다 <i>필수</i>', '입력한 증상 정보를 의료진에게 전달하는 것에 동의합니다 <i>필수</i>'];
  return WF.frame({
    top: WF.top({ step: 5, lang: st.lang }),
    title: WF.title('입력하신 정보가 맞나요?', 'SUMMARY · 최종 확인 후 접수를 완료합니다'),
    body: WF.card({ title: '탐색 결과 · 진료 방향', edits: [[st.skipped ? '탐색하기' : '단서 수정', 'det-clue']], body: `<div class="cells">${c1}</div>` }) +
      WF.sec('동의 항목', cons(0, texts[0]) + cons(1, texts[1]), { en: 'Consent' }) +
      WF.sub([['1', '접수 정보', 'done'], ['2', '증상', 'done'], ['3', '단서', st.clues.length ? 'done' : 'done'], ['4', '동의', ok ? 'done' : 'cur']]),
    statusKind: ok ? 'ok' : 'run', status: ok ? '입력 완료 · 접수를 진행할 수 있습니다' : '필수 동의 2항목에 체크해 주세요 · 접수를 완료하면 수정할 수 없습니다',
    bottom: WF.btn('secondary', '이전: 정보 수정', { go: 'sum-main', act: 'back', cls: 'c6' }) + WF.btn('primary', '접수 완료', { go: 'done', act: 'submit', dis: !ok, cls: 'c6' }),
    foot: WF.footHome() });
};

/* 06-1 접수 완료 */
S.done = function (st) {
  const kb = WF.kbFor(st), rows = WF.score(kb, WF.ansUpTo(st)), top = rows[WF.topIdx(rows)];
  const sent = ['접수 정보', '증상 정보', '진료 방향']
    .map((t) => `<li class="on"><span class="ind" aria-hidden="true"><svg class="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="tx"><b>${t}</b></span></li>`).join('');
  const steps = [['1', '접수처(3층)에서 대기 번호를 알려 주세요', ''], ['2', '대기실 A에서 기다려 주세요', ''], ['3', '이름이 호출되면 진료실로 이동하세요', '']]
    .map((s) => `<li><span class="n">${s[0]}</span><span class="tx">${s[1]}</span></li>`).join('');
  return WF.frame({
    top: WF.top({ step: 6, lang: st.lang }),
    title: WF.title('접수가 완료되었습니다', 'COMPLETE · 입력한 정보가 의료진에게 전달되었습니다'),
    body: `<div class="card solid c12"><div class="card-b"><span class="cap">대기 번호</span><span class="disp">${esc(st.waitNo)}</span><span class="t-sm">${top.kr} · ${st.path === 'pre' ? 'PRE-KIOSK 사전 접수' : '현장 직접 입력'}</span></div></div>` +
      `<div class="sec">${WF.card({ title: '요약 정보 저장', en: 'Save summary', cls: 'c6', body: `<div class="g">${WF.ph('QR 코드 이미지 영역', 'qr c5')}<div class="cap c7">휴대폰으로 QR 코드를 찍으면 접수 내용을 저장할 수 있어요.</div></div>` })}` +
      `${WF.card({ title: '의료진에게 정보 전달', en: '', cls: 'c6', body: `<ul class="sent">${sent}</ul>` })}</div>` +
      WF.card({ title: '다음 단계 안내', en: 'Next steps', body: `<div class="g">${`<ul class="steps-n c8">${steps}</ul>`}${WF.ph('원내 위치 안내 지도 이미지 영역', 'map c4')}</div>` }),
    statusKind: 'ok', status: `접수 완료 · 대기 번호 ${st.waitNo} · 잠시 후 처음 화면으로 돌아갑니다`,
    bottom: WF.btn('secondary', '요약 정보 저장', { act: 'save', cls: 'c6' }) + WF.btn('primary', '처음 화면으로 이동', { go: 'standby', act: 'home', cls: 'c6' }),
    foot: WF.foot() });
};
})();

<script>
/* ===== 인터랙티브 프로토타입: 화면 이동 · 상태 · 분기 · 가상 키보드 ===== */
(function () {
'use strict';
const WF = window.WF; WF.interactive = true;

let S = fresh(), cur = 'standby', hist = [], dlg = null, timer = null, toastT = null;

const TERMS = [
  { t: '개인정보 수집·이용 동의 (예시)', b: '접수와 진료 목적으로 이름, 생년월일, 성별, 국적, 연락처, 보험 정보를 수집합니다. 수집한 정보는 관련 법령에 따라 보관 뒤 파기하며, 동의하지 않으면 키오스크 접수가 제한될 수 있습니다.' },

const NAV = {

  'reg-qr': { prev: () => 'reg-method', next: () => 'reg-p1' },
  'reg-p1': { prev: () => 'reg-qr', next: () => 'reg-p2' },
  'reg-p2': { prev: () => 'reg-p1', next: () => 'reg-load' },
  'reg-load': { prev: () => 'reg-p2', next: () => 'reg-pre', ok: () => false, hint: '불러오는 중입니다' },
  'reg-load-err': { prev: () => 'reg-p2', next: () => 'reg-load' },
  'reg-pre': { prev: () => 'reg-p2', next: () => 'sym-body' },
  'reg-info': { prev: (s) => s.editFrom || 'reg-method', next: () => 'reg-ins', ok: (s) => WF.infoState(s).ok, hint: '필수 항목을 모두 입력해 주세요' },
  'reg-ins': { prev: () => 'reg-info', next: (s) => (s.editFrom === 'reg-pre' || s.editFrom === 'sum-main' ? s.editFrom : 'reg-check'), ok: (s) => WF.insState(s).ok, hint: '보험 정보를 입력해 주세요' },
  'reg-check': { prev: () => 'reg-ins', next: () => 'sym-body' },
  'sym-body': { prev: (s) => (s.path === 'pre' ? 'reg-pre' : 'reg-check'), next: (s) => (s.editFrom === 'sum-main' ? 'sum-main' : 'sym-level'), ok: (s) => s.parts.length > 0, hint: '아픈 부위를 1곳 이상 선택해 주세요' },
  'sym-level': { prev: () => 'sym-body', next: (s) => (s.editFrom === 'sum-main' ? 'sum-main' : 'sym-note'), ok: (s) => s.pain != null && s.symptoms.length > 0, hint: '통증 강도와 주요 증상을 선택해 주세요' },

  'det-clue': { prev: () => 'det-emg', next: () => 'det-q@0', ok: (s) => s.clues.length >= 2, hint: '단서를 2~3개 선택해 주세요' },
  'det-result': { prev: () => QI(Math.max(S.clues.length - 1, 0)), next: () => 'sum-main' },
  'det-call': { prev: () => 'det-emg' },
  'sum-main': { prev: (s) => (s.skipped ? 'det-clue' : 'det-result'), next: () => 'sum-final' },

  done: { prev: null, next: () => 'standby' } };
NAV['det-q'] = {
  prev: () => (idx(cur) === 0 ? 'det-clue' : QI(idx(cur) - 1)),
  ok: () => S.answers[S.clues[idx(cur)]] != null, hint: '답변을 선택해 주세요',
  next: () => (idx(cur) + 1 < S.clues.length && !early() ? QI(idx(cur) + 1) : 'det-result') };
const nav = () => NAV[key(cur)] || {};
const isOk = () => { const n = nav(); return n.ok ? !!n.ok(S) : true; };
/* 방향이 충분히 좁혀지면 남은 질문을 건너뜀 */
function early() {
  if (idx(cur) + 1 >= S.clues.length) return false;
  const sc = WF.score(WF.kbFor(S), WF.ansUpTo(S, idx(cur) + 1)).map((r) => r.score).sort((a, b) => b - a);
  return sc[0] - sc[1] >= 4; }

/* 부위가 바뀌어 진료 방향 규칙이 달라지면 단서·답변을 초기화 */
function sanitize() {
  const kb = WF.kbFor(S), clues = S.clues.filter((c) => kb.clues.some((x) => x.id === c));
  if (clues.length !== S.clues.length) S.answers = {};
  S.clues = clues;
  Object.keys(S.answers).forEach((c) => { if (clues.indexOf(c) < 0) delete S.answers[c]; }); }

function veilHtml() {
  if (dlg === 'call') return WF.dlg('직원을 호출했습니다', '직원이 곧 도착할 예정입니다. 잠시만 기다려 주세요.', '취소', '확인', 'dlg-close');
  if (dlg === 'home') return WF.dlg('처음 화면으로 이동할까요?', '입력 중인 내용이 모두 사라집니다.', '취소', '이동', 'home-confirm');
  if (typeof dlg === 'number') return WF.dlg(TERMS[dlg].t, TERMS[dlg].b, '닫기', '확인', 'dlg-close');
  if (dlg && dlg.pick && PICK[dlg.pick]) { const p = PICK[dlg.pick], v = S.profile[dlg.pick];

function syncNext() {
  const nb = mount.querySelector('[data-act="next"]'); if (!nb) return;

function render() {
  clearTimeout(timer);
  if (key(cur) === 'det-q' && !S.clues[idx(cur)]) cur = 'det-clue';

function focusTitle() { const h = mount.querySelector('.z-title .h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }

function go(id, push) {
  if (!id) return;
  if (id === 'back') { id = hist.pop() || 'home'; push = false; }
  if (key(id) === 'det-q' && String(id).indexOf('@') < 0) { let i = S.clues.findIndex((c) => S.answers[c] == null); id = QI(i < 0 ? 0 : i); }

  if (!id || id === cur) return;

/* 입력 중인 화면의 일부만 다시 그리기 (포커스를 유지하기 위해 전체를 다시 그리지 않음) */

let fieldEl = null, H = null;

  if (!fieldEl) return;
  const k = fieldEl.dataset.k;
  if (cur === 'reg-info') S.profile[k] = fieldEl.value; else if (cur === 'reg-ins') S.insurance[k] = fieldEl.value; else if (cur === 'sym-note') S.note = fieldEl.value;
  const c = mount.querySelector('.counter'); if (c) c.textContent = fieldEl.value.length + ' / 300자';
  refreshFooter(); }
function put(s) { const el = fieldEl, a = el.selectionStart, b = el.selectionEnd; el.value = el.value.slice(0, a) + s + el.value.slice(b); const p = a + s.length; el.setSelectionRange(p, p); H = nul(); typed(); }
/* 조합 중인 글자는 커서가 문장 어디에 있든 그 자리에서 완성된다
   (H.at: 조합 글자 시작 위치, H.ts: 받침이 홀로 입력된 자모, H.t1/H.t2: 겹받침의 앞·뒤 자모) */
function composing(el) { return !!H.shown && el.selectionStart === H.at + H.shown.length && el.selectionEnd === H.at + H.shown.length; }
function back() {
  const el = fieldEl;
  if (!composing(el)) {
    H = nul();
    const a = el.selectionStart, b = el.selectionEnd, d = a === b ? 1 : 0;
    if (a - d < 0) return;
    el.value = el.value.slice(0, a - d) + el.value.slice(b); el.setSelectionRange(a - d, a - d); typed(); return; }
  const at = H.at;
  el.value = el.value.slice(0, at) + el.value.slice(at + H.shown.length);
  if (H.t2) { H.t = H.t1; H.t1 = ''; H.t2 = ''; }
  else if (H.t) { H.t = ''; H.ts = false; }
  else if (H.v) H.v = ''; else H.c = '';
  H.shown = hs(); if (H.shown) el.value = el.value.slice(0, at) + H.shown + el.value.slice(at);
  const p = at + H.shown.length; el.setSelectionRange(p, p); typed(); }
function hangul(k) {
  const el = fieldEl, live = composing(el);
  let at = live ? H.at : el.selectionStart;
  if (live) el.value = el.value.slice(0, at) + el.value.slice(at + H.shown.length);
  else { H = nul(); if (el.selectionStart !== el.selectionEnd) el.value = el.value.slice(0, at) + el.value.slice(el.selectionEnd); }
  const commit = () => { const s = hs(); if (s) { el.value = el.value.slice(0, at) + s + el.value.slice(at); at += s.length; } H = nul(); };
  const tail = () => { H.shown = hs(); H.at = at; if (H.shown) el.value = el.value.slice(0, at) + H.shown + el.value.slice(at); const p = at + H.shown.length; el.setSelectionRange(p, p); typed(); };
  const single = () => { H = nul(); el.setSelectionRange(at, at); put(k); };
  if (CHO.indexOf(k) >= 0) {
    if (!H.c) H.c = k;
    else if (!H.v) { const d = DC[H.c + k]; if (d) H.c = d; else { commit(); H.c = k; } }
    else if (!H.t) { if (JON.indexOf(k) > 0) { H.t = k; H.ts = true; } else { commit(); H.c = k; } }
    else { const d = DJ[H.t + k]; if (d) { H.t1 = H.t; H.t = d; H.ts = false; H.t2 = k; } else { commit(); H.c = k; } }
    tail();
  } else if (JUN.indexOf(k) >= 0) {
    if (!H.c) { single(); return; }
    if (!H.v) H.v = k;
    else if (!H.t) { const d = DV[H.v + k]; if (d) H.v = d; else { commit(); single(); return; } }
    else if (H.ts || H.t2) { const mv = H.t2 || H.t; H.t = H.t2 ? (H.t1 || '') : ''; H.t1 = ''; H.t2 = ''; H.ts = false; commit(); H.c = mv; H.v = k; }
    else { commit(); single(); return; }
    tail(); } }
function redrawKbd() { const kb = mount.querySelector('.kbd'); if (kb) kb.outerHTML = WF.kbd({ layer: S.kbdLayer, shift: S.kbdShift }); }
function isField(el) { return !!el && !!el.matches && el.matches('input[data-k], textarea[data-k]') && String(el.dataset.k).indexOf('spec') !== 0; }

mount.addEventListener('pointerdown', (e) => { if (e.target.closest('.kbd')) e.preventDefault(); });
mount.addEventListener('focusin', (e) => {
  if (!isField(e.target)) return;
  fieldEl = e.target; H = nul();
  if (e.target.getAttribute('inputmode') === 'numeric') S.kbdLayer = 'num'; else if (S.kbdLayer === 'num') S.kbdLayer = 'en';
  S.kbdShift = false;
  const frame = mount.querySelector('.frame');
  if (!mount.querySelector('.kbd')) frame.insertAdjacentHTML('beforeend', WF.kbd({ layer: S.kbdLayer, shift: false }));
  frame.classList.add('kbd-open'); redrawKbd(); });
mount.addEventListener('focusout', (e) => {
  if (!isField(e.target)) return;
  const k = e.target.dataset.k; S.touched[k] = true; typed();
  setTimeout(() => {
    if (isField(document.activeElement)) return;
    if (mount.querySelector('.kbd')) { S.kbdOpen = false; render(); } else { refreshField(k); refreshFooter(); }
  }, 0); });
mount.addEventListener('input', (e) => { if (isField(e.target)) { H = nul(); typed(); } });

/* ── 버튼 · 선택 영역 ── */
mount.addEventListener('click', (e) => {
  const kb = e.target.closest('[data-key]');
  if (kb) {
    const kk = kb.dataset.key;
    if (kk === 'done') { if (fieldEl) S.touched[fieldEl.dataset.k] = true; render(); return; }
    if (kk === 'shift') { S.kbdShift = !S.kbdShift; redrawKbd(); return; }
    if (kk === 'lang') { S.kbdLayer = S.kbdLayer === 'ko' ? 'en' : 'ko'; S.kbdShift = false; redrawKbd(); return; }
    if (kk === 'num') { S.kbdLayer = S.kbdLayer === 'num' ? 'en' : 'num'; S.kbdShift = false; redrawKbd(); return; }
    if (!isField(fieldEl)) return;
    if (kk === 'back') { back(); return; }
    if (fieldEl.getAttribute('inputmode') === 'numeric' && !/^[0-9\-./:,;()&@".]$/.test(kk)) { toast('숫자만 입력할 수 있어요'); return; }
    if (S.kbdLayer === 'ko') hangul(S.kbdShift ? (KS[kk] || kk) : kk); else put(S.kbdShift ? kk.toUpperCase() : kk);
    if (S.kbdShift) { S.kbdShift = false; redrawKbd(); }
    return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const vEl = e.target.closest('[data-v]'), v = vEl ? vEl.dataset.v : t.dataset.v, k = t.dataset.k, n = nav();
  switch (t.dataset.act) {
    case 'next':
      if (t.getAttribute('aria-disabled') === 'true') {
        if (cur === 'reg-info' || cur === 'reg-ins') { Object.keys(cur === 'reg-info' ? S.profile : S.insurance).forEach((f) => { S.touched[f] = true; }); render(); const fe = mount.querySelector('.field.err .in, .field.err [data-act="pick"]'); if (fe) fe.focus(); }
        toast(n.hint ? n.hint(S) : '아직 완료되지 않았어요'); return; }
      go(n.next(S)); break;
    case 'back': go(n.prev ? n.prev(S) : null, false); break;
    case 'hero': go('home'); break;
    case 'lang':
      if (!v || v === 'other') { go('lang'); break; }
      if (cur !== 'lang') { const l = WF.LANGS.find((x) => x.code === v); toast(`언어를 ${l ? l.note : ''}(으)로 변경했습니다`); }
      S.lang = v; render(); break;
    case 'path': S.path = v; render(); break;
    case 'view': S.view = v; render(); break;
    case 'part': { const i = S.parts.indexOf(v); if (i < 0) S.parts.push(v); else S.parts.splice(i, 1); sanitize(); render(); break; }
    case 'unpart': S.parts = S.parts.filter((p) => p !== v); sanitize(); render(); break;
    case 'pain': S.pain = Number(v); render(); break;
    case 'sym': { const i = S.symptoms.indexOf(v); if (i < 0) S.symptoms.push(v); else S.symptoms.splice(i, 1); render(); break; }
    case 'phrase': if (!S.note.includes(v)) S.note = ((S.note ? S.note + ' ' : '') + v).slice(0, 300); render(); break;
    case 'emg': if (v === 'none') { S.emg = ['none']; render(); } else { S.emg = [v]; go('det-call'); } break;
    case 'clue': { const i = S.clues.indexOf(v);
      if (i < 0) { if (S.clues.length >= 3) { toast('단서는 최대 3개까지 선택할 수 있어요'); return; } S.clues.push(v); } else { S.clues.splice(i, 1); delete S.answers[v]; }
      render(); break; }
    case 'answer': S.answers[S.clues[idx(cur)]] = Number(v); render(); break;
    case 'skip': S.skipped = true; go('sum-main'); toast('탐색을 건너뛰고 요약 화면으로 이동했습니다'); break;
    case 'consent': { const i = Number(v); S.consents[i] = !S.consents[i]; render(); break; }
    case 'terms': dlg = Number(v); render(); break;
    case 'call': dlg = 'call'; render(); break;
    case 'home': if (cur === 'done' || cur === 'standby') reset(); else { dlg = 'home'; render(); } break;
    case 'home-confirm': reset(); break;
    case 'dlg-close': dlg = null; render(); focusTitle(); break;
    case 'pick': if (PICK[k]) { dlg = { pick: k }; render(); } break;
    case 'pickv': S.profile[k] = v; S.touched[k] = true; dlg = null; render(); break;
    case 'edit': if (cur === 'sum-main' || cur === 'reg-pre') S.editFrom = cur; go(t.dataset.go); break;
    case 'switch-onsite': S.path = 'onsite'; S.editFrom = null; go('reg-info'); toast('현장 직접 입력으로 전환했습니다'); break;
    case 'retry': go('reg-load'); break;
    case 'submit': if (S.consents[0] && S.consents[1]) go('done'); else toast('필수 동의 2항목에 체크해 주세요'); break;
    case 'save': toast('프로토타입: 요약 정보 QR 저장은 시뮬레이션입니다'); break;
    case 'shoot': S.insurance.doc = true; render(); break;
  } });

/* ── 도구 모음: 화면 비율 · 화면 이동 · 처음부터 ── */
WF.LIST.forEach((it) => { const o = document.createElement('option'); o.value = it[0]; o.textContent = it[1] + ' ' + it[2]; jump.appendChild(o); });
document.querySelectorAll('[data-ar]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-ar]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  device.style.setProperty('--ar', b.dataset.ar); device.style.setProperty('--arn', b.dataset.arn); }));
jump.addEventListener('change', () => jumpTo(jump.value));
document.getElementById('reset').addEventListener('click', reset);

render();
})();

</script>
